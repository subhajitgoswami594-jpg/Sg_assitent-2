  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SG-Assistant - Highway Engineering & Executive Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            },
            amber: {
              500: '#f59e0b',
              600: '#d97706',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(229, 231, 235, 0.8); }
    .dark .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.8); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

  <!-- Top Fixed Bar -->
  <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-amber-500 flex items-center justify-center text-white font-bold text-xl shadow-md">
          SG
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight tracking-tight text-slate-900 dark:text-white">SG-Assistant</h1>
          <p class="text-xs text-amber-600 dark:text-amber-400 font-medium" data-i18n="tagline">Highway Construction Executive</p>
        </div>
      </div>

      <div class="flex items-center space-x-2 sm:space-x-4">
        <!-- Language Selector -->
        <div class="relative inline-block">
          <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold rounded-lg px-2.5 py-1.5 outline-none focus:ring-2 focus:ring-brand-500">
            <option value="en">English 🇬🇧</option>
            <option value="bn">বাংলা 🇧🇩</option>
            <option value="hi">हिंदी 🇮🇳</option>
          </select>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
          <i id="themeIcon" class="fas fa-moon"></i>
        </button>

        <!-- Lock Status Indicator -->
        <button onclick="switchTab('vault')" id="vaultBadge" class="flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-medium bg-red-100 text-red-700 dark:bg-red-950/60 dark:text-red-400 border border-red-300 dark:border-red-800">
          <i class="fas fa-lock text-[10px]"></i>
          <span data-i18n="locked">Locked</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 overflow-x-auto hide-scrollbar sticky top-[61px] z-30 shadow-xs">
    <div class="max-w-7xl mx-auto flex space-x-1 min-w-max py-1.5">
      <button onclick="switchTab('rfi')" id="tab-rfi" class="nav-tab text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-lg transition flex items-center space-x-2 bg-brand-600 text-white">
        <i class="fas fa-road"></i>
        <span data-i18n="nav_rfi">RFI & Chainage</span>
      </button>

      <button onclick="switchTab('billing')" id="tab-billing" class="nav-tab text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fas fa-calculator"></i>
        <span data-i18n="nav_billing">RA Billing</span>
      </button>

      <button onclick="switchTab('hsd')" id="tab-hsd" class="nav-tab text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fas fa-gas-pump"></i>
        <span data-i18n="nav_hsd">HSD & Plant Log</span>
      </button>

      <button onclick="switchTab('voice')" id="tab-voice" class="nav-tab text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fas fa-microphone text-amber-500"></i>
        <span data-i18n="nav_voice">Voice AI</span>
      </button>

      <button onclick="switchTab('vault')" id="tab-vault" class="nav-tab text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fas fa-vault"></i>
        <span data-i18n="nav_vault">Cloud Vault</span>
      </button>

      <button onclick="switchTab('settings')" id="tab-settings" class="nav-tab text-xs sm:text-sm font-medium px-3.5 py-2 rounded-lg transition flex items-center space-x-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
        <i class="fas fa-cog"></i>
        <span data-i18n="nav_settings">Settings</span>
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 space-y-6">

    <!-- TAB 1: RFI Section -->
    <section id="section-rfi" class="space-y-4">
      <div class="glass-card p-4 rounded-xl shadow-sm">
        <h2 class="text-base font-bold mb-3 flex items-center gap-2">
          <i class="fas fa-pen-to-square text-brand-600"></i>
          RFI Entry & Chainage Tracker
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 text-sm">
          <input type="text" id="rfiNo" placeholder="RFI Number (e.g. RFI-102)" class="p-2 border rounded-lg dark:bg-slate-800 dark:border-slate-700">
          <input type="text" id="chainageFrom" placeholder="Chainage From (e.g. 12+400)" class="p-2 border rounded-lg dark:bg-slate-800 dark:border-slate-700">
          <input type="text" id="chainageTo" placeholder="Chainage To (e.g. 12+800)" class="p-2 border rounded-lg dark:bg-slate-800 dark:border-slate-700">
        </div>
        <button onclick="saveRFI()" class="mt-3 bg-brand-600 text-white font-medium px-4 py-2 rounded-lg hover:bg-brand-700 text-xs">
          Save RFI Entry
        </button>
      </div>
    </section>

    <!-- TAB 2: Voice AI Section -->
    <section id="section-voice" class="hidden space-y-4">
      <div class="glass-card p-4 rounded-xl shadow-sm border border-amber-500/20">
        <h2 class="text-base font-bold mb-2 flex items-center gap-2 text-amber-600">
          <i class="fas fa-microphone"></i>
          Boss Voice Command & Multimodal Input
        </h2>
        
        <div class="space-y-3">
          <textarea id="voiceQuery" rows="3" placeholder="Voice instruction or prompt..." class="w-full p-2.5 border rounded-lg text-sm dark:bg-slate-800 dark:border-slate-700"></textarea>
          
          <div class="flex flex-wrap items-center gap-2">
            <button id="recordBtn" onclick="toggleRecord()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2">
              <i class="fas fa-microphone"></i>
              <span>Speak</span>
            </button>
            <button onclick="executeVoiceCommand()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-semibold px-4 py-2 rounded-lg flex items-center gap-2">
              <i class="fas fa-play"></i>
              <span>Execute</span>
            </button>
          </div>
        </div>
      </div>

      <div class="glass-card p-4 rounded-xl shadow-sm">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">AI Assistant Response</h3>
        <div id="aiResponse" class="min-h-[100px] p-3 bg-slate-50 dark:bg-slate-900 rounded-lg text-sm leading-relaxed border dark:border-slate-800">
          Ready for commands...
        </div>
      </div>
    </section>

    <!-- TAB 3: Cloud Vault Section -->
    <section id="section-vault" class="hidden space-y-4">
      <div id="vaultAuthBox" class="glass-card p-6 rounded-xl max-w-md mx-auto text-center space-y-4">
        <i class="fas fa-lock text-3xl text-amber-500"></i>
        <h3 class="font-bold text-lg">Secure Vault Access</h3>
        <div class="relative">
          <input type="password" id="vaultPinInput" placeholder="Enter Access PIN" class="w-full p-2.5 pr-10 border rounded-lg text-center dark:bg-slate-800 dark:border-slate-700 font-mono tracking-widest">
          <button onclick="togglePinVisibility()" class="absolute right-3 top-3 text-slate-400 hover:text-slate-600">
            <i id="pinEyeIcon" class="fas fa-eye"></i>
          </button>
        </div>
        <button onclick="unlockVault()" class="w-full bg-brand-600 text-white font-semibold py-2 rounded-lg hover:bg-brand-700 text-sm">
          Unlock Vault
        </button>
      </div>

      <div id="vaultContent" class="hidden glass-card p-4 rounded-xl shadow-sm space-y-3">
        <h3 class="font-bold text-base text-emerald-600 flex items-center gap-2">
          <i class="fas fa-shield-halved"></i>
          Secure Cloud Vault Unlocked
        </h3>
        <p class="text-xs text-slate-500">Supabase connected successfully. Documents & RFIs are secured.</p>
      </div>
    </section>

    <!-- TAB 4: Settings Section -->
    <section id="section-settings" class="hidden space-y-4">
      <div class="glass-card p-4 rounded-xl shadow-sm space-y-4">
        <h2 class="text-base font-bold flex items-center gap-2">
          <i class="fas fa-sliders text-brand-600"></i>
          System Settings
        </h2>
        <div class="space-y-3 max-w-lg">
          <div>
            <label class="block text-xs font-semibold mb-1">Gemini API Key</label>
            <input type="password" id="apiKeyInput" value="AQ.Ab8RN6LHdpDvUD9vv2bOHsbXVEVBrpI73_XyK0cThMU-u7efpQ" class="w-full p-2 border rounded-lg text-xs dark:bg-slate-800 dark:border-slate-700">
          </div>
          <button onclick="saveSettings()" class="bg-brand-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-brand-700">
            Save Settings
          </button>
        </div>
      </div>
    </section>

  </main>

  <script>
    // Embedded Configuration
    let config = {
      apiKey: "AQ.Ab8RN6LHdpDvUD9vv2bOHsbXVEVBrpI73_XyK0cThMU-u7efpQ",
      vaultPin: "Sg*1989",
      unlocked: false
    };

    function switchTab(tabId) {
      document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.remove('bg-brand-600', 'text-white');
        t.classList.add('text-slate-600', 'dark:text-slate-400');
      });

      const activeSection = document.getElementById(`section-${tabId}`);
      if (activeSection) activeSection.classList.remove('hidden');

      const activeTab = document.getElementById(`tab-${tabId}`);
      if (activeTab) {
        activeTab.classList.add('bg-brand-600', 'text-white');
        activeTab.classList.remove('text-slate-600', 'dark:text-slate-400');
      }
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function togglePinVisibility() {
      const pinInput = document.getElementById('vaultPinInput');
      const icon = document.getElementById('pinEyeIcon');
      if (pinInput.type === 'password') {
        pinInput.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pinInput.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function unlockVault() {
      const pin = document.getElementById('vaultPinInput').value;
      if (pin === config.vaultPin) {
        config.unlocked = true;
        document.getElementById('vaultAuthBox').classList.add('hidden');
        document.getElementById('vaultContent').classList.remove('hidden');
        document.getElementById('vaultBadge').className = "flex items-center space-x-1 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-300 dark:border-emerald-800";
        document.getElementById('vaultBadge').innerHTML = '<i class="fas fa-lock-open text-[10px]"></i><span>Unlocked</span>';
      } else {
        alert("Invalid PIN Code!");
      }
    }

    async function executeVoiceCommand() {
      const query = document.getElementById('voiceQuery').value;
      const resBox = document.getElementById('aiResponse');
      const key = document.getElementById('apiKeyInput').value || config.apiKey;

      if (!query.trim()) {
        resBox.innerText = "Please enter or speak a command first.";
        return;
      }

      resBox.innerText = "Processing command...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: query }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resBox.innerText = data.candidates[0].content.parts[0].text;
        } else {
          resBox.innerText = "Error: " + JSON.stringify(data);
        }
      } catch (err) {
        resBox.innerText = "Error processing command. Please re-check API Key in Settings.";
      }
    }

    function saveSettings() {
      config.apiKey = document.getElementById('apiKeyInput').value;
      alert("Settings saved successfully!");
    }
  </script>
</body>
</html>
